name: auto-merge-digest
# Validates digest data PRs with TRUSTED code (the default branch) and merges them without human review.
# No code from the PR is ever executed: only allowlisted JSON report files are taken from it, then the gate, tests and a full build run.
on:
  pull_request_target:   # runs the BASE workflow (never PR code); fires when the digest bot opens / updates its PR
    types: [opened, reopened, synchronize, labeled]
  workflow_run:
    workflows: ["AI Trend Radar — weekly brief drafting"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"   # polls: the PR-open trigger does not always fire for bot-created PRs
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
concurrency:
  group: data-write
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      pending: ${{ steps.n.outputs.pending }}
    steps:
      - id: n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --label data --label automation --json number --jq 'length')
          echo "pending=$n" >> "$GITHUB_OUTPUT"
  merge:
    needs: check
    if: needs.check.outputs.pending != '0' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ github.event.repository.default_branch }}", fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Validate and merge eligible PRs
        run: |
          set -u
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          BASE="${{ github.event.repository.default_branch }}"
          merged=0
          for n in $(gh pr list --state open --label data --label automation --json number,author,isDraft --jq '.[] | select(.isDraft|not) | select(.author.login|test("^(app/)?github-actions(\\[bot\\])?$")) | .number'); do
            echo "::group::PR #$n"
            git reset -q --hard "origin/$BASE"; git clean -fdq
            oid=$(gh pr view "$n" --json headRefOid --jq .headRefOid)
            files=$(gh pr diff "$n" --name-only)
            if ! take=$(printf '%s\n' "$files" | python -m analyze.automerge_check); then echo "skip #$n: files outside the allowlist"; echo "::endgroup::"; continue; fi
            git fetch -q origin "pull/$n/head"
            [ "$(git rev-parse FETCH_HEAD)" = "$oid" ] || { echo "skip #$n: head moved"; echo "::endgroup::"; continue; }
            git checkout "$oid" -- $take
            WEEK=$(python -c "import json;print(json.load(open('data/trends.json',encoding='utf-8'))['window']['label'])")
            mkdir -p .base; for f in digest slides decks; do git show "origin/$BASE:data/reports/$WEEK/$f.json" > ".base/$f.json" 2>/dev/null || echo '{}' > ".base/$f.json"; done
            validate() {
              # reachability of every official / evidence URL is recorded by trusted code (the tests require url_checks for each URL)
              python -m render.verify_urls --week "$WEEK" || return 1
              python -m analyze.digest_gate --week "$WEEK" --base .base || return 1
              python -m analyze.apply || return 1
              # trusted regeneration: apply ran on the BASE trends.json + the validated report files only
              mkdir -p /tmp/trusted && cp data/trends.json site/data.js "data/reports/$WEEK/enrichment.json" /tmp/trusted/
              python -m render.build_all --offline || return 1
              python -m unittest discover -s tests || return 1
            }
            validate 2>&1 | tee /tmp/validate.log && ok=1 || ok=0
            ok=$([ "${PIPESTATUS[0]}" = 0 ] && echo 1 || echo 0)
            if [ $ok = 1 ]; then
              if gh pr merge "$n" --squash --match-head-commit "$oid"; then
                merged=$((merged+1))
                # whatever generated files the PR carried are replaced by the trusted regeneration
                git fetch -q origin "$BASE"; git reset -q --hard "origin/$BASE"
                cp /tmp/trusted/trends.json data/trends.json; cp /tmp/trusted/data.js site/data.js; cp /tmp/trusted/enrichment.json "data/reports/$WEEK/enrichment.json"
                if ! git diff --quiet -- data/trends.json site/data.js "data/reports/$WEEK/enrichment.json"; then
                  git add data/trends.json site/data.js "data/reports/$WEEK/enrichment.json"; git commit -q -m "digest: url_checks + regenerate trends.json / data.js (trusted)"; git push -q origin "HEAD:$BASE"
                fi
              fi
            else
              why=$(grep -E '^(ERROR|FAIL):|^REJECT|AssertionError|Error:|rror 40|problem\(s\)' /tmp/validate.log | grep -v ' 0 problem' | sort -u | head -8 | cut -c1-220)
              body=$(printf '自動検証に失敗したためマージしませんでした(ログ: %s/%s/actions/runs/%s)。\n\n原因(抜粋):\n```\n%s\n```\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "${why:-(抜粋できませんでした。ログを確認してください)}")
              gh pr comment "$n" --body "$body" || true
              # a failure that repeats on the same head commit is not transient: raise it now instead of waiting for the watchdog
              echo "$oid" > "/tmp/failed-$n"
              prev=$(gh pr view "$n" --json comments --jq '[.comments[].body|select(contains("自動検証に失敗"))]|length')
              if [ "${prev:-0}" -ge 2 ]; then
                t="[auto-merge] digest PR #$n の自動検証が繰り返し失敗しています"
                o=$(gh issue list --state open --search "\"$t\" in:title" --json number --jq '.[0].number // empty')
                [ -z "$o" ] && gh issue create --title "$t" --body "$(printf '同じ PR で自動検証が %s 回失敗しました。多くはコード側(テストや検査)がその週のデータに合っていない場合です。\n\n原因(抜粋):\n```\n%s\n```\n実行ログ: %s/%s/actions/runs/%s' "$prev" "$why" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")" || true
              fi
            fi
            echo "::endgroup::"
          done
          echo "merged=$merged"
          echo "MERGED=$merged" >> "$GITHUB_ENV"
      - name: Publish (build + deploy when enabled) after a merge, or after any digest run (it may have produced only the weekly report)
        if: env.MERGED != '0' || github.event_name == 'workflow_run'
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
