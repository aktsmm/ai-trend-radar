name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Digest gate against the base branch (change cap, deletions, URLs, dates, refs)
        run: |
          WEEK=$(python -c "import json;print(json.load(open('data/trends.json',encoding='utf-8'))['window']['label'])")
          BASE="origin/${{ github.base_ref }}"
          if [ -n "${{ github.base_ref }}" ] && git cat-file -e "$BASE:data/reports/$WEEK/digest.json" 2>/dev/null; then
            mkdir -p .base && for f in digest slides decks; do git show "$BASE:data/reports/$WEEK/$f.json" > ".base/$f.json" 2>/dev/null || echo '{}' > ".base/$f.json"; done
            python -m analyze.digest_gate --week "$WEEK" --base .base
          else
            python -m analyze.digest_gate --week "$WEEK"
          fi
      - name: Build artifacts (offline URL check) then run every test
        run: |
          python -m render.build_all --offline
          python -m unittest discover -s tests
