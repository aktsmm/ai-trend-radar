name: daily-tests
# The PR CI only runs when something changes. This runs the full build + test suite on master every day, so drift (a new week's data,
# an expired URL, a dependency update) is caught before the next scheduled run needs it. A failure opens (or updates) an Issue.
on:
  schedule:
    - cron: "40 21 * * *"   # 06:40 JST, after the daily collect
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: daily-tests
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - id: t
        continue-on-error: true
        run: |
          python -m analyze.digest_gate
          python -m render.build_all --offline
          python -m unittest discover -s tests
      - name: Open / update an issue on failure, close it on recovery
        run: |
          title="[daily-tests] master のフルテストが失敗しています"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "${{ steps.t.outcome }}" = "failure" ]; then
            body="毎日のフルテストが失敗しました: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "フルテストが回復しました。"
          fi
