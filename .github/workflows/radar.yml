name: radar
on:
  schedule:
    - cron: "0 20 * * *"   # daily collect (05:00 JST)
    - cron: "30 15 * * 0"  # weekly report (Mon 00:30 JST)
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # to dispatch pages.yml after the data commit (GITHUB_TOKEN pushes do not trigger other workflows)
concurrency:
  group: data-write
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_pipeline tests.test_digest
      - run: python -m collect.run
        env: { PYTHONIOENCODING: utf-8, GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4   # raw data is an artifact, not Git content
        with:
          name: raw-${{ github.run_id }}
          path: data/raw
          retention-days: 30
      - name: Weekly report
        if: github.event.schedule == '30 15 * * 0' || github.event_name == 'workflow_dispatch'
        env: { PYTHONIOENCODING: utf-8, GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", BRAVE_API_KEY: "${{ secrets.BRAVE_API_KEY }}" }
        run: |
          python -m analyze.report
          python -m analyze.apply
          python -m analyze.validate
      - name: Commit (durable daily snapshots + weekly report)
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/snapshots data/reports data/trends.json site/data.js
          if git diff --cached --quiet; then echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "radar: snapshot / weekly report"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            [ "$i" = 4 ] && { echo "push failed after retries"; exit 1; }
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Start the digest drafting (weekly report only; publishing follows the auto-merge)
        if: steps.commit.outputs.changed == '1' && (github.event.schedule == '30 15 * * 0' || github.event_name == 'workflow_dispatch')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          WEEK=$(python -c "import json;print(json.load(open('data/trends.json',encoding='utf-8'))['window']['label'])")
          gh workflow run digest.lock.yml --ref "${GITHUB_REF_NAME}" -f week="$WEEK"
