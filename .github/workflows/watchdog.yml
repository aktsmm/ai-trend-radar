name: watchdog
# AI-free operations guard: stuck agent runs, one retry of a failed pages build, and a dead-man alert when data goes stale.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MAX_AGENT_MIN: "75"
      MAX_STALE_DAYS: "9"
    steps:
      - name: Cancel digest runs stuck longer than MAX_AGENT_MIN
        run: |
          now=$(date +%s)
          gh run list -R "$REPO" --workflow digest.lock.yml --status in_progress --json databaseId,startedAt --jq '.[] | "\(.databaseId) \(.startedAt)"' | while read id started; do
            age=$(( (now - $(date -d "$started" +%s)) / 60 ))
            if [ "$age" -gt "$MAX_AGENT_MIN" ]; then echo "cancelling $id (${age} min)"; gh run cancel -R "$REPO" "$id" || true; fi
          done
      - name: Retry the latest failed pages run once (only if no newer success)
        run: |
          read id concl attempt < <(gh run list -R "$REPO" --workflow pages.yml --limit 1 --json databaseId,conclusion,attempt --jq '.[0] | "\(.databaseId) \(.conclusion) \(.attempt)"' || echo "")
          if [ "$concl" = "failure" ] && [ "${attempt:-1}" = "1" ]; then gh run rerun -R "$REPO" "$id" --failed || true; fi
      - name: Re-dispatch a failed digest run (at most once; two failures in a row become an issue)
        run: |
          mapfile -t R < <(gh run list -R "$REPO" --workflow digest.lock.yml --limit 2 --json conclusion,status,createdAt --jq '.[] | "\(.conclusion) \(.status) \(.createdAt)"')
          set -- ${R[0]}; c1=$1; s1=$2; t1=$3
          set -- ${R[1]:-none none none}; c2=$1
          [ "$c1" = "failure" ] || { echo "latest digest run: ${c1:-none}/${s1:-none}"; exit 0; }
          age=$(( $(date +%s) - $(date -d "$t1" +%s) ))
          [ "$age" -lt 172800 ] || { echo "failure older than 48 h; not retrying"; exit 0; }
          if [ "$c2" = "failure" ]; then
            title="[watchdog] digest が連続で失敗しています"
            open=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
            [ -z "$open" ] && gh issue create -R "$REPO" --title "$title" --body "digest.lock.yml が 2 回連続で失敗しました。Actions のログと COPILOT_GITHUB_TOKEN を確認してください。" || true
            exit 0
          fi
          WEEK=$(gh api "repos/$REPO/contents/data/trends.json" -H "Accept: application/vnd.github.raw" --jq '.window.label')
          echo "retrying digest for $WEEK"
          gh workflow run digest.lock.yml -R "$REPO" -f week="$WEEK"
      - name: Unstick digest PRs (re-run auto-merge once; open an issue if still open after 24 h)
        run: |
          gh pr list -R "$REPO" --state open --search "head:digest/" --json number,createdAt,headRefName --jq '.[] | "\(.number) \(.createdAt)"' | while read n created; do
            age=$(( ($(date +%s) - $(date -d "$created" +%s)) / 3600 ))
            echo "digest PR #$n open for ${age} h"
            if [ "$age" -ge 4 ]; then gh workflow run auto-merge-digest.yml -R "$REPO" >/dev/null 2>&1 || true; fi
            if [ "$age" -ge 24 ]; then
              title="[watchdog] digest PR #$n が 24 時間以上 merge されていません"
              open=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
              [ -z "$open" ] && gh issue create -R "$REPO" --title "$title" --body "auto-merge-digest の最新の実行ログと PR のコメントを確認してください。検証が通らない原因(コードかデータか)を切り分けます。" || true
            fi
          done
      - name: Keep Pages fresh (deploy again when master is newer than the last successful deploy)
        run: |
          head_at=$(gh api "repos/$REPO/commits/master" --jq '.commit.committer.date')
          last=$(gh run list -R "$REPO" --workflow pages.yml --status success --limit 1 --json updatedAt --jq '.[0].updatedAt // empty')
          running=$(gh run list -R "$REPO" --workflow pages.yml --limit 3 --json status --jq '[.[]|select(.status=="in_progress" or .status=="queued")]|length')
          if [ -z "$last" ] || [ "$(date -d "$head_at" +%s)" -gt $(( $(date -d "$last" +%s) + 1800 )) ]; then
            if [ "$running" = "0" ]; then echo "master ($head_at) is newer than the last deploy (${last:-none}); deploying"; gh workflow run pages.yml -R "$REPO"; fi
          fi
      - name: Dead-man check (last successful radar run)
        run: |
          last=$(gh run list -R "$REPO" --workflow radar.yml --status success --limit 1 --json updatedAt --jq '.[0].updatedAt // empty')
          title="[watchdog] radar has not succeeded for over ${MAX_STALE_DAYS} days"
          if [ -z "$last" ]; then stale=999; else stale=$(( ($(date +%s) - $(date -d "$last" +%s)) / 86400 )); fi
          open=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$stale" -gt "$MAX_STALE_DAYS" ]; then
            [ -z "$open" ] && gh issue create -R "$REPO" --title "$title" --body "最後の成功: ${last:-なし}(${stale} 日前)。Actions の radar を確認してください。" || echo "issue #$open already open"
          elif [ -n "$open" ]; then
            gh issue close -R "$REPO" "$open" --comment "radar が回復しました。"
          fi
