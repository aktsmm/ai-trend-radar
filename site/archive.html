<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アーカイブ - AI Trend Radar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="wrap">
  <a class="brand" href="index.html">AI Trend Radar</a>
  <nav aria-label="メニュー"><a href="index.html">最新ダイジェスト</a><a href="glossary.html">用語・基礎</a><a href="archive.html" aria-current="page">アーカイブ</a><a href="about.html">About</a><a href="api/v1/index.json">JSON API</a></nav>
</div></header>
<main class="wrap">
  <p class="lead">週ごとのダイジェストの一覧です。データがある週のみリンクします。</p>
  <div id="weeks" aria-live="polite">読み込み中…</div>
</main>
<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  fetch("api/v1/index.json").then(r => r.json()).then(d => {
    document.getElementById("weeks").innerHTML = `<table class="cand"><thead><tr><th>週</th><th>期間</th><th>掲載</th><th>リンク</th></tr></thead><tbody>${d.weeks.slice().reverse().map(w =>
      `<tr><td>${esc(w.week)}${w.week === d.latest_week ? "(最新)" : ""}</td><td>${esc(w.window ? w.window.from + " 〜 " + w.window.to : "")}</td><td>${w.published ?? "-"} 件</td><td><a href="${esc(w.page)}">ダイジェスト</a> / <a href="${esc(w.url)}">JSON</a></td></tr>`).join("")}</tbody></table>
      <p class="lead">取得時点: ${esc(d.snapshot_at)}。過去の週は、その週に掲載した項目と成果物をそのまま残しています。</p>`;
  }).catch(() => { document.getElementById("weeks").textContent = "api/v1/index.json を読み込めませんでした(ローカルで file:// を開いている場合は、簡易サーバーで開いてください)。"; });
</script>
</body>
</html>
