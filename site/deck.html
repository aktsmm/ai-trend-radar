<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>deck</title>
<link rel="stylesheet" href="deck.css">
<style>body{margin:0;background:#fff}</style>
</head>
<body>
<div id="out"></div>
<script src="data.js"></script>
<script src="deck.js"></script>
<script>
  // ?e=<entity_id>&n=<0|1>  or  ?e=<entity_id>&all=1  (used by render/build_decks.py)
  const q = new URLSearchParams(location.search);
  const t = window.TRENDS.trends.find(x => x.entity_id === q.get("e"));
  if (t && t.deck) {
    document.getElementById("out").innerHTML = q.get("all") ? renderDeck(t, 0) + renderDeck(t, 1) : renderDeck(t, +(q.get("n") || 0));
    document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
  }
</script>
</body>
</html>
