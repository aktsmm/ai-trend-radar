<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trend Radar (mock)</title>
<style>
  body{font-family:system-ui,"Yu Gothic UI",sans-serif;margin:0;background:#f5f7fb;color:#1c2333}
  header{padding:20px 24px;background:#1c2b4a;color:#fff}
  header p{margin:4px 0 0;opacity:.8;font-size:13px}
  main{max-width:960px;margin:0 auto;padding:16px}
  #filters button{border:1px solid #9aa7c0;background:#fff;border-radius:16px;padding:4px 12px;margin:0 6px 6px 0;cursor:pointer}
  #filters button.on{background:#2f5fd0;color:#fff;border-color:#2f5fd0}
  .card{background:#fff;border-radius:10px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 3px #0002}
  .card h2{margin:0;font-size:18px}
  .rank{display:inline-block;min-width:28px;color:#2f5fd0}
  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:#e3eaff;color:#2a45a0;margin-left:6px}
  .score{float:right;font-weight:600}
  .meta{font-size:12px;color:#556;margin:6px 0}
  .slides{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .slide{flex:1 1 220px;background:linear-gradient(135deg,#eef3ff,#fff6e8);border:1px solid #cfd8ee;border-radius:8px;padding:10px;font-size:13px}
  .slide b{display:block;margin-bottom:4px}
  .slide ul{margin:0;padding-left:18px}
  .x{font-size:12px;color:#444;border-left:3px solid #1d9bf0;padding-left:8px;margin-top:6px}
  a{color:#1d4ed8}
  #meta{font-size:12px;color:#556}
</style>
</head>
<body>
<header><h1>AI Trend Radar <small>(mock)</small></h1><p id="period"></p></header>
<main>
  <div id="filters"></div>
  <div id="list"></div>
  <p id="meta"></p>
</main>
<script src="data.js"></script>
<script>
const D = window.TRENDS, TAGS = ["model","dev-tool","local-runtime","hardware","research","github-trending"];
let cur = "all";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("period").textContent = `${D.window.from} 〜 ${D.window.to}${D.window.partial ? "(集計途中)" : ""} / 最終成功: ${D.last_successful_report_at.slice(0,16)}` + (D.baseline.is_baseline ? ` / ※baseline期間(${D.baseline.snapshots}日分): 「上昇中」ではなく「今週の新着・注目」` : "");
const f = document.getElementById("filters");
["all", ...TAGS].forEach(t => {
  const b = document.createElement("button");
  b.textContent = t; b.onclick = () => { cur = t; render(); };
  f.appendChild(b);
});
function render() {
  [...f.children].forEach(b => b.classList.toggle("on", b.textContent === cur));
  document.getElementById("list").innerHTML = D.trends.filter(t => cur === "all" || t.category === cur).map(t => `
    <div class="card">
      <span class="score">${t.score}</span>
      <h2><span class="rank">#${t.rank}</span>${esc(t.keyword)}<span class="tag">${t.category}</span><span class="tag">${t.kind}</span>${t.tags.map(x => `<span class="tag">${x}</span>`).join("")}</h2>
      <div class="meta">${esc(t.summary)}</div>
      <div class="meta">一次ソース(${esc(t.primary.source_type)}・${t.primary.published_at ? t.primary.published_at.slice(0,10) : "観測日基準"}): <a href="${esc(t.primary.url)}" target="_blank" rel="noopener">${esc(t.primary.title.slice(0,70))}</a>${t.related.length ? ` / 同ベンダー統合: ${esc(t.related.join(", "))}` : ""}</div>
      <div class="meta">公式${t.official_verified ? "" : "(未確認・候補)"}: ${t.official_urls.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join(" / ") || "-"}</div>
      <div class="meta">話題の根拠: ${t.sources.slice(0,4).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(", ")}</div>
      ${t.x_posts.slice(0,1).map(p => `<div class="x">X補助: <a href="${esc(p.url)}" target="_blank">@${esc(p.author)}</a> ♥${p.likes} ↻${p.reposts} 👁${p.views}<br>${esc(p.text)}</div>`).join("")}
      ${t.slides.length ? `<div class="slides">${t.slides.map((s,i) => `<div class="slide"><b>${i+1}. ${esc(s.title)}</b><ul>${s.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>`).join("")}</div>` : ""}
    </div>`).join("");
}
render();
const st = D.source_status, ng = Object.keys(st).filter(k => st[k].ok === false);
document.getElementById("meta").textContent = `取得成功 ${Object.keys(st).length - ng.length}/${Object.keys(st).length}` + (ng.length ? ` (失敗/スキップ: ${ng.join(", ")})` : "") + ` / 保留(一次ソース日付なし) ${D.pending.length}件 / X検索: ${D.x_integration.search && D.x_integration.search.ok ? "OK" : "利用不可(ウォッチリストで代替)"}`;
</script>
</body>
</html>
